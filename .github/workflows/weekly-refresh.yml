name: Weekly Rankings Refresh

on:
  schedule:
    # Run every Monday at 06:00 UTC (before retail business hours)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Growth threshold for rising styles (default: 1.2)"
        required: false
        default: "1.2"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit updated rankings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deployment/requirements-dev.txt

      - name: Run automated rankings refresh
        env:
          RISING_THRESHOLD: ${{ github.event.inputs.threshold || '1.2' }}
        run: |
          python deployment/scripts/refresh_rankings.py --threshold "$RISING_THRESHOLD"

      - name: Verify API tests pass with refreshed rankings
        run: |
          cd deployment
          python -m pytest -v

      - name: Commit and push if rankings updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment/data/rankings.csv
          if git diff --staged --quiet; then
            echo "No rankings changes to commit."
          else
            git commit -m "Auto-refresh weekly fashion trend rankings [${{ github.sha }}]"
            git push origin main
            echo "Updated rankings committed and pushed to main."
          fi
